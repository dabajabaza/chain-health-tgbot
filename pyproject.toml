[project]
name = "chain-health"
description = "Telegram bot for bicycle chain rotation and mileage tracking"
requires-python = ">=3.12"
version = "0.1.0"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Carbon-Based Lifeform", email = "sdrv87@gmail.com" }
]
dependencies = [
    "aiogram>=3.30.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "dishka>=1.10.1",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chain_health"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
# pydantic.mypy only: the legacy SQLAlchemy plugin is unnecessary for
# Mapped[...] models and deprecated — the first upgrade that drops it would
# break mypy startup in CI with an error unrelated to any code change.
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
