repos:
  # Репозиторий публичный, поэтому утёкший секрет уже не спрячешь — его придётся
  # отзывать. Ловим до коммита. detect-private-key берёт только PEM/SSH-блоки,
  # токены ботов и API-ключи находит именно gitleaks.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Runs inside the project's own uv-managed venv (not pre-commit's
        # isolated hook env), since the SQLAlchemy/pydantic mypy plugins need
        # the real installed packages to resolve.
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [src, tests, migrations]
